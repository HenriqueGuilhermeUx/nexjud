# Supabase CLI configuration
# https://supabase.com/docs/guides/cli/config

[project]
project_id = "zoruralbsxrbsaicihzu"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
port = 54321
site_url = "https://nexjudsolucoes.com.br"
additional_redirect_urls = ["https://nexjudsolucoes.com.br", "https://www.nexjudsolucoes.com.br"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Uncomment to enable auth via GitHub
# [auth.external.github]
# enabled = true
# client_id = ""
# secret = ""

[edge_runtime]
enabled = true
policy = "oneshot"
inspect = true

# Server-to-server cron endpoints. Authentication is enforced inside each
# function with the NEXJUD_AUTOMATION_SECRET header, so n8n never needs the
# Supabase service role key.
[functions.process-monitor-cron]
verify_jwt = false

[functions.morning-brief-cron]
verify_jwt = false

# External provider callback. Supabase JWT verification must be disabled because
# Woovi is not a Supabase user; the function verifies the webhook signature itself.
[functions.woovi-webhook]
verify_jwt = false

# Funções chamadas pelo app logado. O gateway exige um JWT e, dentro de cada
# função, _shared/requireUser.ts recusa a anon key: só sessão de usuário passa.
# A anon key é pública e também é um JWT, por isso verify_jwt sozinho não basta.
[functions.process-check]
verify_jwt = true

[functions.red-team]
verify_jwt = true

[functions.super-responder]
verify_jwt = true

[functions.rapid-api]
verify_jwt = true

[functions.generate-embedding]
verify_jwt = true

[functions.strategic-report]
verify_jwt = true

[functions.setup-oab]
verify_jwt = true

[functions.judge-simulator]
verify_jwt = true

[functions.draft-generator]
verify_jwt = true

[functions.red-team-simulator]
verify_jwt = true

[functions.board-report-ai]
verify_jwt = true

[functions.litigation-strategy-ai]
verify_jwt = true

[functions.one-click-ai]
verify_jwt = true

[functions.opponent-intelligence-ai]
verify_jwt = true

[functions.partner-council-ai]
verify_jwt = true

[functions.strategic-analysis]
verify_jwt = true

[functions.tribunal-heatmap-ai]
verify_jwt = true

[functions.war-room-ai]
verify_jwt = true

# Consulta grátis da landing: aceita a anon key de propósito (sem login).
# Só DataJud, sem OpenAI, com limite por IP dentro da função.
[functions.public-process-lookup]
verify_jwt = true

# Chamada pelo app (token do usuário) e por automação (header
# x-nexjud-secret com NEXJUD_AUTOMATION_SECRET). A autenticação é feita dentro
# da função; o gateway precisa deixar passar a chamada de automação.
[functions.process-movement-impact]
verify_jwt = false

[analytics]
enabled = true
port = 54327
backend = "postgres"
