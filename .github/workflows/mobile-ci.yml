name: NexJud Mobile CI

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - "supabase/functions/decision-intelligence/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "supabase/functions/decision-intelligence/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexjud-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Expo + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --ignore-scripts=false
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Expo config
        run: npx expo config --type public >/dev/null
