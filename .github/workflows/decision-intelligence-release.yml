name: NexJud Decision Intelligence Release Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/intelligence/**"
      - "src/pages/DecisionIntelligence.tsx"
      - "src/enterprise/decisionEvidenceAudit.test.ts"
      - "src/enterprise/decisionSearchGuard.test.ts"
      - "package.json"
      - ".github/workflows/decision-intelligence-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --ignore-scripts=false
      - name: Test decision evidence and asynchronous query isolation
        run: npm run test:decision-intelligence
      - name: Typecheck
        run: npx tsc -b
      - name: Build Web/PWA
        run: npx vite build
