[build]
  command = "corepack pnpm install --no-frozen-lockfile && corepack pnpm exec tsc -b && corepack pnpm exec vite build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"
  NPM_FLAGS = "--ignore-scripts"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
