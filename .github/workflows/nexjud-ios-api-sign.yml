name: NexJud iOS — API Signing + TestFlight

on:
  push:
    branches:
      - nexjud-ios-release-b1
    paths:
      - '.github/build-triggers/nexjud-ios-b1.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexjud-ios-api-sign
  cancel-in-progress: false

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  ASC_APP_ID: ${{ secrets.APPLE_APP_ID }}
  BUNDLE_ID: com.nexjud.companion

jobs:
  build_submit:
    name: Generate Apple signing, build IPA, upload TestFlight
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.11.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install --include=dev --no-audit --no-fund
          gem install fastlane --no-document

      - name: Materialize App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "${ASC_API_KEY_P8:-}"
          mkdir -p "$GITHUB_WORKSPACE/mobile/credentials"
          KEY_PATH="$GITHUB_WORKSPACE/mobile/credentials/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH"
          grep -q -- '-----END PRIVATE KEY-----' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "EXPO_ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "EXPO_ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "EXPO_ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
          echo "EXPO_APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "EXPO_APPLE_TEAM_TYPE=INDIVIDUAL" >> "$GITHUB_ENV"

      - name: Require persistent encrypted signing backup
        env:
          IOS_SIGNING_BACKUP_PASSPHRASE: ${{ secrets.IOS_SIGNING_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${IOS_SIGNING_BACKUP_PASSPHRASE:-}" || ${#IOS_SIGNING_BACKUP_PASSPHRASE} -lt 24 ]]; then
            echo "::error::Set IOS_SIGNING_BACKUP_PASSPHRASE (24+ random characters) as a NexJud Actions repository secret before generating a new Apple certificate. This prevents losing the new private key."
            exit 1
          fi

      - name: Prepare isolated signing keychain
        run: |
          set -euo pipefail
          CERT_DIR="$RUNNER_TEMP/nexjud-ios-signing"
          KEYCHAIN_PATH="$RUNNER_TEMP/nexjud.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PASSWORD="$(openssl rand -hex 24)"
          mkdir -p "$CERT_DIR" "$GITHUB_WORKSPACE/mobile/ios/certs"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          {
            echo "CERT_DIR=$CERT_DIR"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
            echo "P12_PASSWORD=$P12_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Free known stale ephemeral Apple Distribution slots
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'spaceship'
          token = Spaceship::ConnectAPI::Token.create(
            key_id: ENV.fetch('ASC_KEY_ID'),
            issuer_id: ENV.fetch('ASC_ISSUER_ID'),
            filepath: ENV.fetch('ASC_KEY_PATH'),
            duration: 1200,
            in_house: false
          )
          Spaceship::ConnectAPI.token = token
          known_stale = %w[B9MLK33CS4 VSXF79VZFR HMSNJ25PYU F54B4YAS5N CQV5AUGFS3]
          certs = Spaceship::ConnectAPI::Certificate.all
          known_stale.each do |id|
            cert = certs.find { |item| item.id == id }
            next unless cert
            cert.delete!
            puts "Revoked known stale ephemeral certificate #{id}."
          end
          puts "Unrecognized Apple Distribution certificates were left untouched."
          RUBY

      - name: Generate new NexJud distribution identity once
        env:
          IOS_SIGNING_BACKUP_PASSPHRASE: ${{ secrets.IOS_SIGNING_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)
          platform :ios do
            lane :bootstrap_signing do
              api_key = app_store_connect_api_key(
                key_id: ENV.fetch("ASC_KEY_ID"),
                issuer_id: ENV.fetch("ASC_ISSUER_ID"),
                key_filepath: ENV.fetch("ASC_KEY_PATH"),
                duration: 1200,
                in_house: false
              )
              cert(
                api_key: api_key,
                team_id: ENV.fetch("APPLE_TEAM_ID"),
                development: false,
                generate_apple_certs: true,
                output_path: ENV.fetch("CERT_DIR"),
                keychain_path: ENV.fetch("KEYCHAIN_PATH"),
                keychain_password: ENV.fetch("KEYCHAIN_PASSWORD")
              )
              cert_id = lane_context[SharedValues::CERT_CERTIFICATE_ID]
              UI.user_error!("Distribution certificate ID unavailable") if cert_id.to_s.empty?
              File.write(File.join(ENV.fetch("CERT_DIR"), "cert-id.txt"), cert_id.to_s)
              sigh(
                api_key: api_key,
                app_identifier: ENV.fetch("BUNDLE_ID"),
                team_id: ENV.fetch("APPLE_TEAM_ID"),
                force: true,
                filename: "profile.mobileprovision",
                output_path: ENV.fetch("CERT_DIR"),
                cert_id: cert_id
              )
            end
          end
          RUBY
          fastlane ios bootstrap_signing
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          test -s "$CERT_DIR/profile.mobileprovision"
          security export -k "$KEYCHAIN_PATH" -t identities -f pkcs12 -P "$P12_PASSWORD" -o "$CERT_DIR/dist.p12"
          test -s "$CERT_DIR/dist.p12"
          mkdir -p "$RUNNER_TEMP/nexjud-backup"
          cp "$CERT_DIR/dist.p12" "$RUNNER_TEMP/nexjud-backup/dist.p12"
          cp "$CERT_DIR/profile.mobileprovision" "$RUNNER_TEMP/nexjud-backup/profile.mobileprovision"
          cp "$CERT_DIR/cert-id.txt" "$RUNNER_TEMP/nexjud-backup/cert-id.txt"
          printf '%s' "$P12_PASSWORD" > "$RUNNER_TEMP/nexjud-backup/p12-password.txt"
          tar -C "$RUNNER_TEMP/nexjud-backup" -czf "$RUNNER_TEMP/nexjud-signing.tar.gz" .
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/nexjud-signing.tar.gz" -out "$GITHUB_WORKSPACE/nexjud-signing-backup.enc" -pass env:IOS_SIGNING_BACKUP_PASSPHRASE
          test -s "$GITHUB_WORKSPACE/nexjud-signing-backup.enc"

      - name: Preserve encrypted Apple signing backup
        uses: actions/upload-artifact@v4
        with:
          name: NexJud-Encrypted-Apple-Signing-Backup
          path: nexjud-signing-backup.enc
          if-no-files-found: error
          retention-days: 90

      - name: Export signing identity for local EAS build
        run: |
          set -euo pipefail
          cp "$CERT_DIR/dist.p12" "$GITHUB_WORKSPACE/mobile/ios/certs/dist.p12"
          cp "$CERT_DIR/profile.mobileprovision" "$GITHUB_WORKSPACE/mobile/ios/certs/profile.mobileprovision"
          test -s "$GITHUB_WORKSPACE/mobile/ios/certs/dist.p12"
          test -s "$GITHUB_WORKSPACE/mobile/ios/certs/profile.mobileprovision"
          node <<'NODE'
          const fs=require('fs');
          fs.writeFileSync("credentials.json",JSON.stringify({
            ios:{
              provisioningProfilePath:"ios/certs/profile.mobileprovision",
              distributionCertificate:{path:"ios/certs/dist.p12",password:process.env.P12_PASSWORD}
            }
          },null,2));
          NODE

      - name: Validate NexJud release identity
        run: |
          set -euo pipefail
          node <<'NODE'
          const app=require('./app.json').expo;
          const eas=require('./eas.json');
          if(app.version!=='1.0.1') throw new Error('Unexpected app version');
          if(String(app.ios?.buildNumber)!=='1') throw new Error('Unexpected iOS build number');
          if(app.ios?.bundleIdentifier!=='com.nexjud.companion') throw new Error('Bundle ID changed');
          if(app.ios?.infoPlist?.ITSAppUsesNonExemptEncryption!==false) throw new Error('Encryption declaration changed');
          if(eas?.submit?.production?.ios?.ascAppId!=='6820244418') throw new Error('ASC App ID mismatch');
          if(eas?.build?.['ios-api-ci']?.credentialsSource!=='local') throw new Error('Local credentials profile missing');
          console.log('PASS: NexJud iOS release identity validated.');
          NODE
          npx tsc --noEmit

      - name: Validate and repair PNG asset chunk checksums
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import struct, zlib
          for path in Path("assets").glob("*.png"):
              data = path.read_bytes()
              if not data.startswith(bytes.fromhex("89504e470d0a1a0a")):
                  raise SystemExit(f"Invalid PNG signature: {path}")
              out = bytearray(data[:8])
              pos = 8
              fixes = 0
              while pos + 12 <= len(data):
                  size = struct.unpack(">I", data[pos:pos+4])[0]
                  end = pos + 12 + size
                  if end > len(data):
                      raise SystemExit(f"Truncated PNG chunk: {path}")
                  chunk = data[pos+4:pos+8+size]
                  old_crc = struct.unpack(">I", data[pos+8+size:end])[0]
                  crc = zlib.crc32(chunk) & 0xffffffff
                  out += data[pos:pos+8+size] + struct.pack(">I", crc)
                  fixes += (old_crc != crc)
                  pos = end
                  if chunk[:4] == b"IEND":
                      break
              if pos != len(data):
                  raise SystemExit(f"Invalid PNG trailing data: {path}")
              if fixes:
                  path.write_bytes(out)
              print(f"{path}: {fixes} PNG CRC corrections")
          PY

      - name: Build signed App Store IPA locally
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          IPA="$GITHUB_WORKSPACE/NexJud-AppStore.ipa"
          eas build --platform ios --profile ios-api-ci --local --non-interactive --output "$IPA"
          test -s "$IPA"
          shasum -a 256 "$IPA" > "$GITHUB_WORKSPACE/SHA256SUMS-IOS.txt"

      - name: Verify final IPA version and build
        run: |
          set -euo pipefail
          INFO_ENTRY="$(unzip -Z1 "$GITHUB_WORKSPACE/NexJud-AppStore.ipa" | grep -E '^Payload/[^/]+\.app/Info\.plist
      - name: Upload signed IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexJud-IOS
          path: |
            NexJud-AppStore.ipa
            SHA256SUMS-IOS.txt
          if-no-files-found: error
          retention-days: 30
 | head -n1)"
          test -n "$INFO_ENTRY"
          unzip -p "$GITHUB_WORKSPACE/NexJud-AppStore.ipa" "$INFO_ENTRY" > "$RUNNER_TEMP/NexJud-Info.plist"
          SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/NexJud-Info.plist")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/NexJud-Info.plist")"
          echo "Embedded NexJud version=$SHORT_VERSION build=$BUILD_NUMBER"
          test "$SHORT_VERSION" = "1.0.1"
          test "$BUILD_NUMBER" = "1"

      - name: Confirm NexJud signing certificate is active before upload
        run: |
          set -euo pipefail
          CERT_ID="$(cat "$CERT_DIR/cert-id.txt")"
          export CERT_ID
          ruby <<'RUBY'
          require 'spaceship'
          token = Spaceship::ConnectAPI::Token.create(
            key_id: ENV.fetch('ASC_KEY_ID'),
            issuer_id: ENV.fetch('ASC_ISSUER_ID'),
            filepath: ENV.fetch('ASC_KEY_PATH'),
            duration: 1200,
            in_house: false
          )
          Spaceship::ConnectAPI.token = token
          cert = Spaceship::ConnectAPI::Certificate.all.find { |item| item.id == ENV.fetch('CERT_ID') }
          raise 'NexJud signing certificate is not active before upload' unless cert
          puts "ACTIVE_NEXJUD_CERT_ID=#{cert.id}"
          RUBY

      - name: Upload NexJud directly to App Store Connect
        env:
          IPA_PATH: ${{ github.workspace }}/NexJud-AppStore.ipa
        run: |
          set -euo pipefail
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)
          platform :ios do
            lane :upload_local do
              api_key = app_store_connect_api_key(
                key_id: ENV.fetch("ASC_KEY_ID"),
                issuer_id: ENV.fetch("ASC_ISSUER_ID"),
                key_filepath: ENV.fetch("ASC_KEY_PATH"),
                duration: 1200,
                in_house: false
              )
              pilot(
                api_key: api_key,
                ipa: ENV.fetch("IPA_PATH"),
                skip_waiting_for_build_processing: true,
                distribute_external: false
              )
            end
          end
          RUBY
          fastlane ios upload_local

      - name: Upload signed IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexJud-IOS
          path: |
            NexJud-AppStore.ipa
            SHA256SUMS-IOS.txt
          if-no-files-found: error
          retention-days: 30
