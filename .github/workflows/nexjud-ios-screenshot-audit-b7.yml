name: NexJud iOS App Store screenshots — read-only audit

on:
  push:
    branches:
      - nexjud-ios-free-offline-b7
    paths:
      - '.github/build-triggers/nexjud-ios-screenshot-audit-b7.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot_audit:
    name: Check all Apple iOS screenshots by locale and device without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install JWT validation library
        run: python -m pip install --quiet pyjwt cryptography
      - name: Read App Store Connect metadata (no edits)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error
          import jwt
          key = os.environ['APPLE_KEY'].replace('\\n','\n')
          token = jwt.encode(
              {'iss': os.environ['APPLE_ISSUER_ID'], 'iat': int(time.time()), 'exp': int(time.time())+600,
               'aud': 'appstoreconnect-v1'},
              key, algorithm='ES256', headers={'kid': os.environ['APPLE_KEY_ID'], 'typ':'JWT'}
          )
          root = 'https://api.appstoreconnect.apple.com/v1/'
          def fetch(route):
              try:
                  req=urllib.request.Request(root+route, headers={'Authorization':'Bearer '+token})
                  with urllib.request.urlopen(req, timeout=25) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  print('App Store Connect API HTTP status:',e.code,'route:',route)
                  raise
          app = '6820244418'
          versions = fetch(f'apps/{app}/appStoreVersions?limit=50').get('data',[])
          for v in versions:
              attr = v.get('attributes',{})
              if attr.get('platform') != 'IOS': continue
              print('IOS version:', attr.get('versionString'), 'status:', attr.get('appStoreState'))
              if not str(attr.get('versionString','')).startswith('1.0.4'): continue
              locales=fetch(f'appStoreVersions/{v["id"]}/appStoreVersionLocalizations?limit=100').get('data',[])
              for loc in locales:
                  language=loc.get('attributes',{}).get('locale','?')
                  print(' Locale:',language)
                  sets=fetch(f'appStoreVersionLocalizations/{loc["id"]}/appScreenshotSets?limit=100').get('data',[])
                  if not sets: print('  No legacy screenshot sets; check App Asset Library / Media Manager')
                  for s in sets:
                      display=s.get('attributes',{}).get('screenshotDisplayType','unknown')
                      assets=fetch(f'appScreenshotSets/{s["id"]}/appScreenshots?limit=100').get('data',[])
                      print('  Device:',display,'count:',len(assets))
                      # Do not print URLs or files; avoid exposing private content.
          PY
