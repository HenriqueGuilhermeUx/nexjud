name: NexJud Web CI

on:
  pull_request:
    branches: [main, feature/decision-intelligence-v1]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexjud-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript + Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts=false

      - name: TypeScript
        run: npx tsc -b

      - name: Billing entitlement regression tests
        run: npx vitest run src/enterprise/paidEntitlement.test.ts

      - name: Commercial copy and PDF HTML safety regressions
        run: npx vitest run src/enterprise/commercialPredictiveCopy.test.ts src/enterprise/pdfReportSecurity.test.ts

      - name: Checkout login return regression
        run: npx vitest run src/enterprise/postLoginDestination.test.ts

      - name: Authenticated subscription isolation regression
        run: npx vitest run src/enterprise/subscriptionForUser.test.ts

      - name: Subscription lookup failure and retry regression
        run: npx vitest run src/enterprise/subscriptionLookupRecovery.test.ts

      - name: Predictive evidence dossier regressions
        run: npx vitest run src/intelligence/predictiveEvidenceDossier.test.ts

      - name: Judge DNA sourced strategy regression
        run: npx vitest run src/intelligence/judgeStrategyAdvice.test.ts

      - name: Vite build
        run: npx vite build
