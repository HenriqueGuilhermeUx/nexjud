name: Edge Functions CI

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "netlify/functions/datajud-proxy.mjs"
      - ".github/workflows/edge-functions-ci.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Deno type check (funções protegidas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check
        # O package.json da raiz é do frontend (Vite). Sem esta variável o Deno
        # tenta resolver os pacotes npm pelo node_modules do frontend.
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: |
          deno check \
            supabase/functions/_shared/requireUser.ts \
            supabase/functions/_shared/cnj.ts \
            supabase/functions/_shared/datajud.ts \
            supabase/functions/_shared/escavador.ts \
            supabase/functions/_shared/processData.ts \
            supabase/functions/_shared/djen.ts \
            supabase/functions/djen-relay/index.ts \
            supabase/functions/case-monitor/index.ts \
            supabase/functions/escavador-webhook/index.ts \
            supabase/functions/setup-oab/index.ts \
            supabase/functions/public-process-lookup/index.ts \
            supabase/functions/datajud-search/index.ts \
            supabase/functions/decision-intelligence/index.ts \
            supabase/functions/public-process-lookup/index.ts \
            supabase/functions/process-check/index.ts \
            supabase/functions/red-team/index.ts \
            supabase/functions/super-responder/index.ts \
            supabase/functions/rapid-api/index.ts \
            supabase/functions/generate-embedding/index.ts \
            supabase/functions/strategic-report/index.ts \
            supabase/functions/setup-oab/index.ts \
            supabase/functions/judge-simulator/index.ts \
            supabase/functions/draft-generator/index.ts \
            supabase/functions/red-team-simulator/index.ts \
            supabase/functions/board-report-ai/index.ts \
            supabase/functions/litigation-strategy-ai/index.ts \
            supabase/functions/one-click-ai/index.ts \
            supabase/functions/opponent-intelligence-ai/index.ts \
            supabase/functions/partner-council-ai/index.ts \
            supabase/functions/strategic-analysis/index.ts \
            supabase/functions/tribunal-heatmap-ai/index.ts \
            supabase/functions/war-room-ai/index.ts

      - name: Every function that spends money requires login
        run: |
          set -e
          for fn in process-check datajud-search decision-intelligence red-team super-responder rapid-api generate-embedding strategic-report setup-oab judge-simulator draft-generator red-team-simulator board-report-ai litigation-strategy-ai one-click-ai opponent-intelligence-ai partner-council-ai strategic-analysis tribunal-heatmap-ai war-room-ai; do
            file="supabase/functions/$fn/index.ts"
            grep -q 'requireUser(req' "$file" || { echo "::error file=$file::$fn não chama requireUser"; exit 1; }
            grep -A1 "^\[functions\.$fn\]" supabase/config.toml | grep -q 'verify_jwt = true' || { echo "::error::$fn sem verify_jwt = true no config.toml"; exit 1; }
          done
          grep -q 'auth.getUser' supabase/functions/process-movement-impact/index.ts

      - name: Escavador usage stays on documented routes
        run: |
          set -e
          # Uma chamada por busca de OAB (antes eram até 15 endereços tentados).
          ! grep -n 'api/v1\|advogados/oab\|envolvidos/oab' supabase/functions/setup-oab/index.ts
          grep -q '"/advogado/processos"' supabase/functions/setup-oab/index.ts
          # A consulta grátis nunca pede movimentações nem partes (custo e privacidade).
          grep -q 'lookupProcess(cnj, { movements: false })' supabase/functions/public-process-lookup/index.ts

      - name: Netlify DataJud proxy syntax and guard
        run: |
          node --check netlify/functions/datajud-proxy.mjs
          grep -q "timingSafeEqual" netlify/functions/datajud-proxy.mjs
          grep -q "SUPABASE_SERVICE_ROLE_KEY" supabase/functions/djen-relay/index.ts
          node --check netlify/functions/monitor-schedule.mjs
          grep -q "api-publica.datajud.cnj.jus.br" netlify/functions/datajud-proxy.mjs
