name: NexJud iOS Free 1.0.4 (7) — Upload verified IPA to TestFlight

on:
  push:
    branches:
      - nexjud-ios-free-offline-b7
    paths:
      - '.github/build-triggers/nexjud-ios-free-testflight-b7.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: nexjud-ios-free-testflight-b7
  cancel-in-progress: false

jobs:
  upload:
    name: Upload previously verified signed IPA (no certificate changes)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Download exact successful NexJud iOS Free 1.0.4 (7) artifact
        uses: actions/download-artifact@v4
        with:
          name: NexJud-IOS-Free-1.0.4-build-7
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 39879604786
          path: release

      - name: Verify IPA checksum, bundle identity, build and signed payload
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, os, plistlib, zipfile
          ipa = "release/NexJud-AppStore.ipa"
          if not os.path.isfile(ipa):
              raise SystemExit("IPA missing from verified artifact")
          checksum = hashlib.sha256(open(ipa, "rb").read()).hexdigest()
          checksum_file = "release/SHA256SUMS-IOS.txt"
          if not os.path.isfile(checksum_file): raise SystemExit("Signed artifact SHA256SUMS missing")
          lines = open(checksum_file, encoding="utf-8").read().splitlines()
          expected = lines[0].split()[0] if len(lines) == 1 else ""
          if len(expected) != 64 or not all(ch in "0123456789abcdef" for ch in expected):
              raise SystemExit("Invalid recorded SHA-256")
          if checksum != expected:
              raise SystemExit("IPA SHA-256 mismatch, upload blocked")
          with zipfile.ZipFile(ipa) as z:
              paths=[p for p in z.namelist() if p.startswith("Payload/") and p.endswith(".app/Info.plist") and p.count("/")==2]
              if len(paths)!=1: raise SystemExit("Unexpected IPA payload")
              info=plistlib.loads(z.read(paths[0]))
              if z.testzip() is not None: raise SystemExit("Corrupt IPA")
              if not any("/_CodeSignature/" in p for p in z.namelist()):
                  raise SystemExit("No iOS code signature resources in IPA")
          if info.get("CFBundleIdentifier")!="com.nexjud.companion":
              raise SystemExit("Wrong iOS bundle identifier")
          if str(info.get("CFBundleShortVersionString"))!="1.0.4" or str(info.get("CFBundleVersion"))!="7":
              raise SystemExit("Wrong iOS version/build")
          if not info.get("NSPhotoLibraryUsageDescription"):
              raise SystemExit("Photo library purpose string missing")
          print("PASS: exact NexJud 1.0.4 (7) SHA-256, IPA and Info.plist.")
          PY

      - name: Install Fastlane for App Store Connect submission
        run: gem install fastlane --no-document

      - name: Prepare Apple App Store Connect API signing key
        env:
          ASC_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "${ASC_KEY_ID:-}" && test -n "${ASC_ISSUER_ID:-}" && test -n "${ASC_API_KEY_P8:-}"
          mkdir -p "$RUNNER_TEMP/nexjud-asc"
          KEY_PATH="$RUNNER_TEMP/nexjud-asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY_PATH"
          grep -q -- '-----END PRIVATE KEY-----' "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight only (not App Review or public App Store)
        run: |
          set -euo pipefail
          export IPA_PATH="$GITHUB_WORKSPACE/release/NexJud-AppStore.ipa"
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)
          platform :ios do
            lane :upload_local do
              api_key = app_store_connect_api_key(
                key_id: ENV.fetch("ASC_KEY_ID"),
                issuer_id: ENV.fetch("ASC_ISSUER_ID"),
                key_filepath: ENV.fetch("ASC_KEY_PATH"),
                duration: 1200,
                in_house: false
              )
              pilot(
                api_key: api_key,
                ipa: ENV.fetch("IPA_PATH"),
                skip_waiting_for_build_processing: false,
                distribute_external: false
              )
            end
          end
          RUBY
          fastlane ios upload_local

      - name: TestFlight upload summary
        run: |
          echo "NexJud iOS 1.0.4 (7) uploaded to TestFlight (no App Review submission)." >> "$GITHUB_STEP_SUMMARY"
          echo "No demo account needed; verify screenshots in all iOS device groups before App Review." >> "$GITHUB_STEP_SUMMARY"
